<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Ridge Fireworks</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; touch-action: manipulation;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* 9:16 무대: 위 = 내 모습(카메라), 아래 = 폭죽 페이지 */
  #stage { position: relative; width: var(--sw, 360px); height: calc(var(--sw, 360px) * 16 / 9);
           background: #000; overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; width: 100%; height: 29.7%; background: #0b0b0b; overflow: hidden; }
  #cam canvas { display: block; width: 100%; height: 100%; }
  #cam .hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 12%;
               text-align: center; color: #777; font: 13px/1.6 system-ui, sans-serif; letter-spacing: .02em; }
  #art { position: absolute; left: 0; bottom: 0; width: 100%; height: 70.3%; overflow: hidden; cursor: crosshair; }
  #art canvas { position: absolute; left: 0; bottom: 0; width: 100%; display: block;
                image-rendering: pixelated; image-rendering: crisp-edges; }
  /* Tab 전체 모드: 카메라 숨기고 폭죽 그림(4:5)만 화면 가득 */
  body.full #stage { height: calc(var(--sw, 360px) * 465 / 372); }
  body.full #cam { display: none; }
  body.full #art { height: 100%; cursor: default; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><canvas id="camc"></canvas><div class="hint">카메라를 허용하면 손으로 폭죽을 터뜨릴 수 있어요</div></div>
  <div id="art"><canvas id="c" width="372" height="465" aria-label="산 위로 클릭하거나 손을 쥐었다 펴면 불꽃놀이가 터지는 픽셀 그림"></canvas></div>
</div>
<script src="mountains.js?v=20261124p"></script>
<script src="fireworks.js?v=20261124p"></script>
<script type="module" src="hand.js?v=20261124p"></script>
</body>
</html>
